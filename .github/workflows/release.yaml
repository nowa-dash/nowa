name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-pi-image:
    name: Build and release image
    runs-on: ubuntu-24.04-arm
    env:
      IMG_NAME: nowa-${{ github.event.release.tag_name }}-arm64.img

    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y parted dosfstools e2fsprogs

      - name: Build image
        run: sudo ./build/build-image.sh "$IMG_NAME"

      - name: Compress image
        run: sudo xz -T0 -9 "$IMG_NAME"

      - name: Upload image to release
        uses: softprops/action-gh-release@master
        with:
          files: ${{ env.IMG_NAME }}.xz
